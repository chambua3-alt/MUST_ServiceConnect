<!DOCTYPE html>

<html lang="en">

<head>


<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width, initial-scale=1.0">

<title>Services | MUST ServiceConnect</title>

<link rel="stylesheet" href="css/style.css">


</head>

<body>


<!-- Header -->

<header>

    <div class="logo">
        MUST ServiceConnect
    </div>

    <nav>
        <a href="index.html">Home</a>
        <a href="services.html">Services</a>
        <a href="appointments.html">Appointments</a>
        <a href="login.html">Login</a>
    </nav>

</header>


<!-- Hero -->

<section class="hero">

    <h1>University Services</h1>

    <p>
        Search and check the availability of university
        services, offices and lecturers.
    </p>

</section>


<!-- Search -->

<section class="form-section">

    <div class="form-container">

        <div class="form-card">

            <h2>Search Services</h2>

            <div class="form-group">

                <label for="service-search">
                    Search by service name, special name or location
                </label>

                <input
                    type="text"
                    id="service-search"
                    placeholder="Search for a service..."
                >

            </div>

        </div>

    </div>

</section>

<!-- Services -->

<section class="status-section">

    <h2>
        Available Services
    </h2>

    <div id="services-container">

        <p style="text-align: center;">
            Loading services...
        </p>

    </div>

</section>

<!-- Footer -->

<footer>

    <p>
        © 2026 MUST ServiceConnect |
        Smart Service Availability & Appointment System
    </p>

</footer>


<script src="js/script.js"></script>


</body>

</html>
