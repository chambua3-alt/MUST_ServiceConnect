<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0">

    <title>
        Create Account | MUST ServiceConnect
    </title>

    <link
        rel="stylesheet"
        href="css/style.css">

</head>


<body>


    <!-- Header -->

    <header>

        <div class="logo">
            MUST ServiceConnect
        </div>


        <nav>

            <a href="index.html">
                Home
            </a>

            <a href="services.html">
                Services
            </a>

            <a href="appointments.html">
                Appointments
            </a>

            <a href="login.html">
                Login
            </a>

        </nav>

    </header>



    <!-- Hero -->

    <section class="hero">

        <h1>
            Create Account
        </h1>

        <p>
            Create an account to access
            MUST ServiceConnect services.
        </p>

    </section>



    <!-- Sign Up Form -->

    <section class="form-section">

        <div class="form-container">

            <div class="form-card">


                <h2>
                    Create Your Account
                </h2>


                <form id="signup-form">


                    <!-- Full Name -->

                    <div class="form-group">

                        <label for="fullname">
                            Full Name
                        </label>

                        <input
                            type="text"
                            id="fullname"
                            name="fullname"
                            placeholder="Enter your full name"
                            required>

                    </div>



                    <!-- Email -->

                    <div class="form-group">

                        <label for="email">
                            Email Address
                        </label>

                        <input
                            type="email"
                            id="email"
                            name="email"
                            placeholder="Enter your email address"
                            required>

                    </div>



                    <!-- Phone -->

                    <div class="form-group">

                        <label for="phone">
                            Phone Number
                        </label>

                        <input
                            type="tel"
                            id="phone"
                            name="phone"
                            placeholder="Enter your phone number"
                            required>

                    </div>



                    <!-- User Type -->

                    <div class="form-group">

                        <label for="user-role">
                            User Type
                        </label>

                        <select
                            id="user-role"
                            name="role"
                            required>

                            <option value="">
                                Select User Type
                            </option>

                            <option value="student">
                                Student
                            </option>

                            <option value="provider">
                                Service Provider
                            </option>

                            <option value="service-manager">
                                Service Manager
                            </option>

                            <option value="appointment-officer">
                                Appointment Officer
                            </option>

                            <option value="admin">
                                Administrator
                            </option>

                        </select>

                    </div>



                    <!-- Provider Information -->

                    <div
                        id="provider-fields"
                        style="display: none;">


                        <!-- Provider ID -->

                        <div class="form-group">

                            <label for="provider-id">
                                Provider ID
                            </label>

                            <input
                                type="text"
                                id="provider-id"
                                name="provider-id"
                                placeholder="Enter Provider ID">

                        </div>



                        <!-- Service Category -->

                        <div class="form-group">

                            <label for="service-category">
                                Service Category
                            </label>

                            <select
                                id="service-category"
                                name="service-category">

                                <option value="">
                                    Select service category
                                </option>

                                <option value="lecturer">
                                    Lecturer Consultation
                                </option>

                                <option value="office">
                                    University Offices
                                </option>

                                <option value="important-service">
                                    Important Services
                                </option>

                            </select>

                        </div>



                        <!-- Service -->

                        <div class="form-group">

                            <label for="service">
                                Service
                            </label>

                            <select
                                id="service"
                                name="service">

                                <option value="">
                                    Select a category first
                                </option>

                            </select>

                        </div>


                    </div>



                    <!-- Password -->

                    <div class="form-group">

                        <label for="signup-password">
                            Create Password
                        </label>

                        <input
                            type="password"
                            id="signup-password"
                            name="password"
                            placeholder="Create your password"
                            required>

                    </div>



                    <!-- Confirm Password -->

                    <div class="form-group">

                        <label for="confirm-password">
                            Confirm Password
                        </label>

                        <input
                            type="password"
                            id="confirm-password"
                            name="confirm-password"
                            placeholder="Confirm your password"
                            required>

                    </div>



                    <!-- Submit -->

                    <button
                        type="submit"
                        class="btn">

                        Create Account

                    </button>


                </form>



                <!-- Login -->

                <div class="form-link">

                    <p>

                        Already have an account?

                        <a href="login.html">
                            Login
                        </a>

                    </p>

                </div>


            </div>

        </div>

    </section>



    <!-- Footer -->

    <footer>

        <p>

            © 2026 MUST ServiceConnect |

            Smart Service Availability &
            Appointment System

        </p>

    </footer>



    <script src="js/script.js"></script>

</body>

</html>
