<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">
    <title>Service Provider Registration | MUST ServiceConnect</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

    <!-- Header -->
    <header>
        <div class="logo">
            MUST ServiceConnect
        </div>

        <nav>
            <a href="index.html">Home</a>
            <a href="services.html">Services</a>
            <a href="appointments.html">Appointments</a>
            <a href="login.html">Login</a>
        </nav>
    </header>

    <!-- Hero -->
    <section class="hero">
        <h1>Service Provider Registration</h1>
        <p>
            Create an account to become a service provider
            on MUST ServiceConnect.
        </p>
    </section>

    <!-- Sign Up Form -->
    <section class="form-section">
        <div class="form-container">
            <div class="form-card">

                <h2>Create Provider Account</h2>

                <form id="signup-form">

                    <div class="form-group">
                        <label for="fullname">
                            Full Name
                        </label>

                        <input
                            type="text"
                            id="fullname"
                            name="fullname"
                            placeholder="Enter your full name"
                            required
                        >
                    </div>

                    <div class="form-group">
                        <label for="email">
                            Email Address
                        </label>

                        <input
                            type="email"
                            id="email"
                            name="email"
                            placeholder="Enter your email address"
                            required
                        >
                    </div>

                    <div class="form-group">
                        <label for="phone">
                            Phone Number
                        </label>

                        <input
                            type="tel"
                            id="phone"
                            name="phone"
                            placeholder="Enter your phone number"
                            required
                        >
                    </div>

                    <div class="form-group">
                        <label for="provider-id">
                            Provider ID
                        </label>

                        <input
                            type="text"
                            id="provider-id"
                            name="provider-id"
                            placeholder="Create your Provider ID"
                            required
                        >
                    </div>
                    
<div class="form-group">
    <label for="service-category">
        Service Category
    </label>

    <select
        id="service-category"
        name="service-category"
        required
    >
        <option value="">
            Select service category
        </option>

        <option value="lecturer">
            Lecturer Consultation
        </option>

        <option value="office">
            University Offices
        </option>

        <option value="important-service">
            Important Services
        </option>
    </select>
</div>

<div class="form-group">
    <label for="service">
        Service
    </label>

    <select
        id="service"
        name="service"
        required
    >
        <option value="">
            Select a category first
        </option>
    </select>
</div>


                    <div class="form-group">
                        <label for="signup-password">
                            Create Password
                        </label>

                        <input
                            type="password"
                            id="signup-password"
                            name="password"
                            placeholder="Create your password"
                            required
                        >
                    </div>

                    <div class="form-group">
                        <label for="confirm-password">
                            Confirm Password
                        </label>

                        <input
                            type="password"
                            id="confirm-password"
                            name="confirm-password"
                            placeholder="Confirm your password"
                            required
                        >
                    </div>

                    <button type="submit" class="btn">
                        Create Provider Account
                    </button>

                </form>

                <div class="form-link">
                    <p>
                        Already have an account?
                        <a href="login.html">
                            Login
                        </a>
                    </p>
                </div>

            </div>
        </div>
    </section>

    <!-- Footer -->
    <footer>
        <p>
            © 2026 MUST ServiceConnect |
            Smart Service Availability & Appointment System
        </p>
    </footer>

    <script src="js/script.js"></script>
</body>
</html>
