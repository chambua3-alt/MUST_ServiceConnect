<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">
    <title>Login | MUST ServiceConnect</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="icon" type="image/png" href="images/logo.png">
</head>
<body>

    <!-- Header -->
    <header>
        <div class="logo">
            MUST ServiceConnect
        </div>

        <nav>
            <a href="index.html">Home</a>
            <a href="services.html">Services</a>
            <a href="appointments.html">Appointments</a>
            <a href="login.html">Login</a>
        </nav>
    </header>

    <!-- Login Hero -->
    <section class="hero">
        <h1>Welcome to MUST ServiceConnect</h1>
        <p>
            Login to access your account and manage university services.
        </p>
    </section>

    <!-- Login Form -->
    <section class="form-section">
        <div class="form-container">
            <div class="form-card">

                <h2>Login to Your Account</h2>

                <form id="login-form">

                    <div class="form-group">
                        <label for="user-role">
                            Login As
                        </label>

                        <select
                            id="user-role"
                            name="role"
                            required
                        >
                            <option value="">
                                Select User Type
                            </option>

                            <option value="student">
                                Student
                            </option>

                            <option value="provider">
                                Service Provider
                            </option>

                            <option value="service-manager">
                                Service Manager
                            </option>

                            <option value="appointment-officer">
                                Appointment Officer
                            </option>

                            <option value="admin">
                                Administrator
                            </option>
                        </select>
                    </div>

                    <div class="form-group">
                        <label for="login-id">
                            User ID
                        </label>

                        <input
                            type="text"
                            id="login-id"
                            name="user-id"
                            placeholder="Enter your User ID"
                            required
                        >
                    </div>

                    <div class="form-group">
                        <label for="login-password">
                            Password
                        </label>

                        <input
                            type="password"
                            id="login-password"
                            name="password"
                            placeholder="Enter your password"
                            required
                        >
                    </div>

                    <button type="submit" class="btn">
                        Login
                    </button>

                </form>

                <div class="form-link">
                    <p>
                        Don't have an account?
                        <a href="signup.html">
                            Create Account
                        </a>
                    </p>
                </div>

                <div id="login-message"></div>

            </div>
        </div>
    </section>


    <footer>
        <p>
            © 2026 MUST ServiceConnect |
            Smart Service Availability & Appointment System
        </p>
    </footer>

    <script src="js/script.js"></script>
</body>
</html>
