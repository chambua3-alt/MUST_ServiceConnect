<!DOCTYPE html>

<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width, initial-scale=1.0">

<title>Appointments | MUST ServiceConnect</title>

<link rel="stylesheet" href="css/style.css">
<link rel="icon" type="image/png" href="images/logo.png">


</head>

<body>


<!-- Header -->

<header>

    <div class="logo">
        MUST ServiceConnect
    </div>

    <nav>
        <a href="index.html">Home</a>
        <a href="services.html">Services</a>
        <a href="appointments.html">Appointments</a>
        <a href="login.html">Login</a>
    </nav>

</header>


<!-- Hero -->

<section class="hero">

    <h1>Request an Appointment</h1>

    <p>
        Request an appointment with a lecturer,
        university office or other available service.
    </p>

</section>


<!-- Appointment Form -->

<section class="form-section">

    <div class="form-container">

        <div class="form-card">

            <h2>Appointment Request</h2>

            <form id="appointment-form">

                <div class="form-group">

                    <label for="fullname">
                        Full Name
                    </label>

                    <input
                        type="text"
                        id="fullname"
                        name="fullname"
                        placeholder="Enter your full name"
                        required
                    >

                </div>


                <div class="form-group">

                    <label for="phone">
                        Phone Number
                    </label>

                    <input
                        type="tel"
                        id="phone"
                        name="phone"
                        placeholder="Enter your phone number"
                        required
                    >

                </div>


                <div class="form-group">

                    <label for="email">
                        Email Address
                    </label>

                    <input
                        type="email"
                        id="email"
                        name="email"
                        placeholder="Enter your email address"
                        required
                    >

                </div>


                <div class="form-group">

    <label for="service-category">
        Service Category
    </label>

    <select
        id="service-category"
        name="service-category"
        required
    >

        <option value="">
            Loading service categories...
        </option>

    </select>

</div>

<div class="form-group">

    <label for="service">
        Service Required
    </label>

    <select
        id="service"
        name="service"
        required
    >

        <option value="">
            Select a category first
        </option>

    </select>

</div>


                <div class="form-group">

    <label for="service-provider">
        Person or Office Providing the Service
    </label>

    <select
        id="service-provider"
        name="service-provider"
        required
    >

        <option value="">
            Select a service first
        </option>

    </select>

</div>

                <div class="form-group">

                    <label for="reason">
                        Reason for Appointment
                    </label>

                    <textarea
                        id="reason"
                        name="reason"
                        placeholder="Briefly explain the reason for your appointment..."
                        required
                    ></textarea>

                </div>


                <div class="form-group">

                    <label for="appointment-date">
                        Preferred Date
                    </label>

                    <input
                        type="date"
                        id="appointment-date"
                        name="appointment_date"
                        required
                    >

                </div>


                <button type="submit" class="btn">
                    Submit Appointment Request
                </button>

            </form>


            <div
                id="appointment-message"
                class="appointment-message"
            >

            </div>

        </div>

    </div>

</section>


<!-- Footer -->

<footer>

    <p>
        © 2026 MUST ServiceConnect |
        Smart Service Availability & Appointment System
    </p>

</footer>


<script src="js/script.js"></script>


</body>

</html>
